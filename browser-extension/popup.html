<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>FlowGet</title>
<link rel="stylesheet" href="popup.css">
<body><h1>FlowGet</h1><p>输入文件直链，发送到桌面下载队列。</p>
<form id="download"><label for="url">下载地址</label><input id="url" type="url" required placeholder="https://example.com/file.zip" autofocus>
<button type="submit">发送到 FlowGet</button></form><p id="status" role="status"></p>
<small>也可以右键网页上的链接，选择“用 FlowGet 下载此链接”。</small>
<script src="popup.js"></script></body></html>
